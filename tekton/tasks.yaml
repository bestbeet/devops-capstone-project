# Tasks for local k3d Tekton CD lab
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: clear
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-source
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      workingDir: $(workspaces.source.path)
      args: ["clone", "--depth", "1", "--branch", "$(params.revision)", "$(params.repo-url)", "."]
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint-source
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir flake8==4.0.1
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.23.2
      command: ["/kaniko/executor"]
      args:
        - "--dockerfile=$(workspaces.source.path)/Dockerfile"
        - "--context=$(workspaces.source.path)"
        - "--destination=$(params.image)"
        # For an explicitly trusted, HTTP-only local k3d lab registry.
        - "--insecure"
        - "--skip-tls-verify"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-accounts
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: registry.k8s.io/kubectl:v1.30.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        kubectl apply -f deploy/kubernetes/accounts.yaml
        kubectl set image deployment/accounts accounts="$(params.image)"
        kubectl rollout status deployment/accounts --timeout=180s
        kubectl get deployments,pods,replicasets,services
